name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Resolve core dependencies
        id: core
        run: deno task core:status
      - run: deno task check
      - run: deno task test
      # A lane pinned to a development core commit cannot be published.
      - if: steps.core.outputs.adapters == 'published'
        run: deno task publish:check:adapters
      - if: steps.core.outputs.editor_sdk == 'published'
        run: deno task publish:check:editor-sdk

  npm-package:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve core dependencies
        id: core
        run: deno task core:status
      - name: Build, smoke-test, and pack the adapters
        if: steps.core.outputs.adapters == 'published'
        run: |
          deno task npm:build:rehype
          deno task npm:build:satteri
          deno task npm:build:astro
          deno task npm:install
          node scripts/npm_smoke.mjs adapters
          (cd npm/rehype && npm pack --dry-run)
          (cd npm/satteri && npm pack --dry-run)
          (cd npm/astro && npm pack --dry-run)
      - name: Build, smoke-test, and pack the editor SDK
        if: steps.core.outputs.editor_sdk == 'published'
        run: |
          deno task npm:build:editor-sdk
          node scripts/npm_smoke.mjs editor-sdk
          node scripts/npm_editor_smoke.mjs
          node scripts/npm_editor_pack_check.mjs

  editor-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/editor-sdk
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task check
      - run: deno task test
